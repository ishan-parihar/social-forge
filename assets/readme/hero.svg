<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Social Forge — one Rust binary, 30 social platforms, three interfaces</title>
  <desc id="desc">A dark forge hub with CLI, REST, and MCP spokes radiating posts to a ring of 30 platform nodes</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- pulse rings -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#f97316" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#f97316" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#f97316" stroke-opacity="0.05" stroke-width="1"/>
  <!-- spokes -->
  <line x1="200" y1="200" x2="1060" y2="200" stroke="url(#spoke)" stroke-width="3"/>
  <line x1="200" y1="200" x2="200" y2="40" stroke="url(#spoke)" stroke-width="3"/>
  <line x1="200" y1="200" x2="200" y2="360" stroke="url(#spoke)" stroke-width="3"/>
  <!-- hub -->
  <circle cx="200" cy="200" r="58" fill="url(#core)"/>
  <circle cx="200" cy="200" r="58" fill="none" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2"/>
  <text x="200" y="196" text-anchor="middle" font-family="monospace" font-size="17" fill="#fff7ed" font-weight="bold">FORGE</text>
  <text x="200" y="216" text-anchor="middle" font-family="monospace" font-size="12" fill="#fde68a">1 binary</text>
  <!-- interface labels -->
  <rect x="420" y="186" width="220" height="28" rx="14" fill="#1c1917" stroke="#f97316" stroke-opacity="0.5"/>
  <text x="530" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#fdba74">CLI · REST · MCP (300+ tools)</text>
  <!-- platform nodes on ring -->
  <g font-family="monospace" font-size="11" fill="#fde68a">
    <circle cx="340" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="340" y="204" text-anchor="middle" font-size="9">X</text>
    <circle cx="408" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="408" y="204" text-anchor="middle" font-size="9">RD</text>
    <circle cx="700" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="700" y="204" text-anchor="middle" font-size="9">YT</text>
    <circle cx="760" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="760" y="204" text-anchor="middle" font-size="9">IG</text>
    <circle cx="820" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="820" y="204" text-anchor="middle" font-size="9">TG</text>
    <circle cx="880" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="880" y="204" text-anchor="middle" font-size="9">WA</text>
    <circle cx="940" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="940" y="204" text-anchor="middle" font-size="9">LI</text>
    <circle cx="1000" cy="200" r="14" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/><text x="1000" y="204" text-anchor="middle" font-size="9">FB</text>
    <circle cx="340" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="340" y="150" text-anchor="middle" font-size="8">DS</text>
    <circle cx="340" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="340" y="258" text-anchor="middle" font-size="8">TK</text>
    <circle cx="408" cy="120" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="408" y="124" text-anchor="middle" font-size="8">GH</text>
    <circle cx="408" cy="280" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="408" y="284" text-anchor="middle" font-size="8">PI</text>
    <circle cx="700" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="700" y="150" text-anchor="middle" font-size="8">TH</text>
    <circle cx="760" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="760" y="150" text-anchor="middle" font-size="8">BS</text>
    <circle cx="820" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="820" y="150" text-anchor="middle" font-size="8">MA</text>
    <circle cx="880" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="880" y="150" text-anchor="middle" font-size="8">MD</text>
    <circle cx="940" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="940" y="150" text-anchor="middle" font-size="8">DV</text>
    <circle cx="1000" cy="146" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="1000" y="150" text-anchor="middle" font-size="8">HN</text>
    <circle cx="700" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="700" y="258" text-anchor="middle" font-size="8">SL</text>
    <circle cx="760" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="760" y="258" text-anchor="middle" font-size="8">LM</text>
    <circle cx="820" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="820" y="258" text-anchor="middle" font-size="8">FC</text>
    <circle cx="880" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="880" y="258" text-anchor="middle" font-size="8">KC</text>
    <circle cx="940" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="940" y="258" text-anchor="middle" font-size="8">VK</text>
    <circle cx="1000" cy="254" r="12" fill="#1c1917" stroke="#fbbf24" stroke-width="1"/><text x="1000" y="258" text-anchor="middle" font-size="8">SK</text>
  </g>
  <!-- footer -->
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="13" fill="#a8a29e">30 platforms · dual-path auth · self-hosted · agent-native</text>
</svg>
