version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_forge
      POSTGRES_USER: social_forge
      POSTGRES_PASSWORD: social_forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_forge"]
      interval: 5s
      timeout: 3s
      retries: 5

  social-forge:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3444:3444"
    environment:
      DATABASE_URL: postgres://social_forge:social_forge@postgres:5432/social_forge
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_URL: http://localhost:3444
      FRONTEND_URL: http://localhost:3444
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
