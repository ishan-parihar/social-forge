# ─── Social Forge — PostgreSQL only ──────────────────────────
# Postgres runs via Docker (auto-starts on boot via restart: unless-stopped).
# The social-forge binary runs directly via systemd for fast dev iteration.
# See: systemctl status social-forge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_forge
      POSTGRES_USER: social_forge
      POSTGRES_PASSWORD: social_forge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_forge"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:        # Use `docker compose down` (NOT down -v) to preserve data
