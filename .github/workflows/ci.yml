name: CI

# CI gates master pushes AND every version tag (v*) + manual dispatch.
# Release.yml stays manual-only (workflow_dispatch). The audit's lint gate
# is only real if it runs on regular pushes, not just tags.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shell script syntax validation — fast, no compute cost
  validate-scripts:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/switchpost-start.sh
          bash -n scripts/vendor-pull.sh
          echo "✓ Shell scripts are syntactically valid"

  # Rust syntax/type check — uses SQLX_OFFLINE with pre-cached queries
  # Only runs on push to master to avoid burning compute on every PR
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Vendor freshness gate — runs before any cargo invocation so a
      # mis-pinned, drifted or un-fetchable vendored source fails the build
      # instead of passing silently (plan v25 §9).
      #
      # Local drift is fatal unconditionally. Upstream advisories (newer
      # release, yanked pin) are reported but not fatal, because §7 of
      # VENDOR_PINS.md lists known-accepted ones. Once §7 is empty, set
      # VENDOR_PULL_STRICT: "true" here to make advisories fatal for good.
      - name: Verify vendor pins
        run: ./scripts/vendor-pull.sh --check

      # Only check that our source files parse — full compile happens in release.yml
      - name: Syntax check (rustfmt parse only)
        run: cargo fmt --all -- --check
        # Note: format diffs are informational only; pre-existing formatting is not
        # blocked here. The release build is the authoritative compile check.

      # Lint gate (audit 2026-10-14 §9). Pinned by rust-toolchain.toml so the
      # gate does not drift with @stable; `[lints.clippy] all = "deny"` in
      # Cargo.toml already fails on clippy::all, and this step additionally
      # denies rustc's own warnings so the gate is fully clean.
      - name: Clippy (deny all warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Library tests (no DB required)
        run: cargo test --lib
        # Library tests use the committed .sqlx/ cache (SQLX_OFFLINE=true above),
        # so they need no database — a failure here is a real failure.
