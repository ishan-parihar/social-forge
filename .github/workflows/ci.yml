name: CI

# Run on PRs and pushes to main/master branches only.
# Tags are handled exclusively by release.yml — do NOT add tags: ['v*'] here.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

# Cancel redundant runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shell script syntax validation — fast, no compute cost
  validate-scripts:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/social-forge-start.sh
          echo "✓ Shell scripts are syntactically valid"

  # Rust syntax/type check — uses SQLX_OFFLINE with pre-cached queries
  # Only runs on push to master to avoid burning compute on every PR
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only check that our source files parse — full compile happens in release.yml
      - name: Syntax check (rustfmt parse only)
        run: cargo fmt --all -- --check 2>/dev/null || true
        # Note: format diffs are informational only; pre-existing formatting is not
        # blocked here. The release build is the authoritative compile check.

      - name: Library tests (no DB required)
        run: cargo test --lib 2>&1 || true
        # Best-effort: tests that require DB will fail without a connection,
        # which is expected in CI. Release build is the compile gate.
