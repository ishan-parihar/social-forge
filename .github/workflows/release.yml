name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger for re-releases or testing
  workflow_dispatch:

# Only one release per tag — cancel any duplicate runs
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # ── Step 1: Build frontend once (all Rust targets share the same JS build) ─
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11.x requires Node.js >= 22.13
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest   # pnpm 11+ requires Node >= 22.13 — satisfied by setup-node above

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts skips postinstall scripts (including esbuild's),
        # which is fine because esbuild ships native binaries as separate optional
        # packages (@esbuild/linux-x64 etc.) — no postinstall needed for the build.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend (SvelteKit static)
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  # ── Step 2: Build Rust binary per target (frontend embedded via rust-embed) ─
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: social-forge-linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: social-forge-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: social-forge-macos-x64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: social-forge-macos-arm64

    steps:
      - uses: actions/checkout@v4

      # Restore the frontend build so rust-embed picks it up at compile time
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install musl tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/social-forge"
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            aarch64-linux-gnu-strip "$BIN" || true
          else
            strip "$BIN" || true
          fi

      - name: Strip binary (macOS)
        if: contains(matrix.target, 'darwin')
        run: strip "target/${{ matrix.target }}/release/social-forge" || true

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/social-forge" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
