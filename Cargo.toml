[package]
name = "social-forge"
version = "0.2.21"
edition = "2021"
description = "Social media scheduling platform — Rust backend with axum REST API + rmcp MCP server, JWT auth, SSE realtime, and in-process scheduler"
authors = ["Ishan Parihar"]
license = "MIT"
repository = "https://github.com/ishan-parihar/social-forge"
homepage = "https://github.com/ishan-parihar/social-forge"
keywords = ["mcp", "social-media", "scheduler", "axum", "social-forge"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "social-forge"
path = "src/main.rs"

[dependencies]
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
# Web framework
axum = { version = "0.8", features = ["macros"] }
mime = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "trace"] }

# MCP
rmcp = { version = "1.6", features = [
  "server",
  "macros",
  "transport-io",
  "schemars",
] }
schemars = { version = "1.0", features = ["derive", "chrono04", "uuid1"] }

# Database
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP client (reqwest for most providers)
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "cookies",
  "gzip",
] }

# wreq — reqwest fork with JA3/JA4/TLS fingerprinting for X/Twitter GraphQL API
wreq = { version = "=6.0.0-rc.23", default-features = false, features = [
  "json",
  "cookies",
  "gzip",
  "brotli",
] }
wreq-util = "=3.0.0-rc.10"

# Time + UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Telegram MTProto (Grammers — pure Rust, no C deps)
grammers-client = "0.7"
grammers-mtproto = "0.7"
grammers-mtsender = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"

# WhatsApp Web (replaces external Go wacli sidecar)
wa-rs = "0.2.0"
wa-rs-sqlite-storage = "0.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
rand = "0.8"
base64 = { version = "0.22", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
regex = "1"

# SSE + async streaming
async-stream = "0.3"

# Config
dotenvy = "0.15"

# GitHub API (octocrab for GraphQL/REST)
octocrab = { version = "0.42", default-features = false, features = ["rustls"] }

# Multipart (media uploads)
axum-extra = { version = "0.10", features = ["multipart"] }

# MIME type detection for uploads
mime_guess = "2"

# URL encoding for OAuth
url = { version = "2", features = ["serde"] }
urlencoding = "2"

# RSS feed parsing
feed-rs = "2.1"

# Embed frontend/build directory into the binary at compile time
# When frontend/build/ doesn't exist, rust-embed produces an empty set (no panic).
rust-embed = { version = "8", features = ["include-exclude"] }

[patch.crates-io]
# core2 0.4.0 was yanked from crates.io, but glass_pumpkin 1.6 (transitive
# dep of grammers-crypto 0.7) still requires it. The real core2 is a
# no_std reimplementation of std::io; glass_pumpkin only uses core2::error,
# which in std contexts is identical to std::error::Error. This local stub
# re-exports the std types so the build unblocks.
core2 = { path = "vendor/core2" }

